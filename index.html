<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDS-Regelspiel</title>
<style>
:root{color-scheme:light;--bg:#f6f6f2;--card:#fff;--ink:#23262b;--mute:#5d6269;--line:#dcdcd5;
--L:#0a5fae;--Ll:#e6f0f9;--G:#d81b7f;--Gl:#fce8f3;--V:#2f8a3e;--Vl:#e7f4e9;--O:#7a5a00;--Ol:#fff6d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:700px;margin:auto;padding:16px 16px 50px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.center{text-align:center}
.logo{width:130px;height:130px}
h1{font-size:1.55rem;margin:6px 0 8px}
h2{font-size:1.15rem;margin:0 0 8px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:.9rem}
label.f{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],textarea,select{width:100%;border:1px solid #aaa;border-radius:7px;padding:8px;background:#fff}
textarea{min-height:70px}
.btn{border:1px solid #999;background:#fff;border-radius:8px;padding:10px 15px}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.modes{display:grid;gap:10px;margin-top:6px}
.mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;text-align:left}
.mode b{display:block;font-size:1.08rem}
.mode .rec{font-size:.78rem;background:var(--ink);color:#fff;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.mode[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.place{border:1px solid #aaa;background:#fff;border-radius:9px;padding:9px 11px;text-align:left}
.place[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
details.info{border-top:1px solid var(--line);padding:9px 0}
details.info summary{cursor:pointer;font-weight:600}
details.info p{margin:8px 0 0}
.hud{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:.92rem;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.rule{font-size:1.3rem;font-weight:600;margin:8px 0 16px}
.tag{display:inline-block;font-size:.8rem;background:#ecedef;border-radius:10px;padding:2px 9px;margin:0 4px 4px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ch{border:2px solid var(--c);background:var(--cl);border-radius:10px;padding:12px 9px;font-weight:600}
.ch small{display:block;font-weight:400;font-size:.8rem;margin-top:4px;line-height:1.3}
.ch small b{font-weight:600}
.ch.pick{background:var(--c);color:#fff}
.ch:disabled{cursor:default}
.ch:disabled:not(.pick){opacity:.55}
.cL{--c:var(--L);--cl:var(--Ll)}.cG{--c:var(--G);--cl:var(--Gl)}.cV{--c:var(--V);--cl:var(--Vl)}.cO{--c:var(--O);--cl:var(--Ol)}
.fb{margin-top:14px;padding:12px;border-radius:9px;border-left:6px solid;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.fb b{display:block}
.r{background:var(--Vl);border-color:var(--V)}.t{background:var(--Ol);border-color:var(--O)}.w{background:#fde9e6;border-color:#b3392a}
.hint{margin-top:8px;font-size:.92rem;background:#fff;border-radius:6px;padding:6px 8px}
.decide{margin-top:12px}
.decide .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid #888;background:#fff;border-radius:16px;padding:5px 12px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
details.note{margin-top:12px}
details.note summary{cursor:pointer;color:var(--mute)}
.chk{display:block;margin:8px 0 4px}
.likert{border-top:1px solid var(--line);padding:12px 0}
.likert p{font-weight:600;margin-bottom:7px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scale button{border:1px solid #999;background:#fff;border-radius:8px;padding:8px 4px;font-size:.85rem}
.scale button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.score{font-size:2.5rem;font-weight:700;margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{border-radius:9px;padding:10px;text-align:center;border-top:5px solid}
.stat b{display:block;font-size:1.5rem}
.poster{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px}
.pg{border-left:6px solid var(--c);padding:1px 0 1px 11px;margin:10px 0}
.pg h3{margin:0;color:var(--c);font-size:1rem}
.pg ul{margin:4px 0 0;padding-left:18px}
.own{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding:9px 0}
.link{background:none;border:0;text-decoration:underline;color:var(--mute);padding:2px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:560px){.choices{grid-template-columns:1fr}.scale{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="main"></main>
<div id="toast" role="status"></div>

try{const j=localStorage.getItem(STORE);if(j)s=Object.assign(fresh(),JSON.parse(j))}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(s))}catch(e){}}
const $=q=>document.querySelector(q);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const judge=(r,p)=>p===r.k?'r':r.a.includes(p)?'t':'w';
const placeLabel=r=>r.p.map(p=>PLACES[p]).join(', ');
function stats(){
 const c={r:0,t:0,w:0};let streak=0,best=0;
 s.order.forEach(id=>{const a=s.ans[id];if(!a)return;const j=judge(BY[id],a.p);c[j]++;streak=j==='w'?0:streak+1;best=Math.max(best,streak)});
 return{...c,done:c.r+c.t+c.w,pts:c.r*2+c.t,max:s.order.length*2,streak,best};
}
const modeLabel=()=>MODES[s.mode].n+(s.mode==='ort'?': '+PLACES[s.place]:'');
function render(){({start:vStart,play:vPlay,notes:vNotes,check:vCheck,end:vEnd})[s.screen]();window.scrollTo(0,0)}

function vStart(){
 const running=s.order.length&&Object.keys(s.ans).length;
 $('#main').innerHTML=`<section class="panel"><div class="center"><img class="logo" src="${LOGO}" alt="Logo mit den Werten Lernen, Gemeinschaft und Verantwortung"><h1>Das KDS-Regelspiel</h1></div>
 <p>Unsere neue Schulordnung soll auf drei Werten aufbauen: Lernen, Gemeinschaft und Verantwortung. Die Regeln für Mensa, Pausenhof oder Ruheraum hängen später dort, wo sie gelten, und jede soll sich auf einen der Werte zurückführen lassen.</p>
 <p>Wir möchten wissen, ob das mit unseren bisherigen Regeln klappt. Du ordnest einige Regeln zu und sagst uns am Ende in vier kurzen Fragen, wie gut die Werte aus deiner Sicht tragen. Das Ergebnis schickst du als PDF in Teams an Felix, Anna-Lena oder Vanessa.</p>
 ${running?`<p class="row"><span>Du hast eine Runde angefangen (${esc(modeLabel())}).</span><button class="btn p" data-resume>Weiterspielen</button></p>`:''}
 <h2 style="margin-top:14px">Wie viel Zeit hast du?</h2>
 <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode" data-mode="${k}" aria-pressed="${s.mode===k}"><b>${m.n}${m.rec?'<span class="rec">empfohlen</span>':''}</b><span class="mute small">${m.d}</span></button>`).join('')}</div>
 ${s.mode==='ort'?`<div class="places">${Object.entries(PLACES).map(([k,n])=>`<button class="place" data-place="${k}" aria-pressed="${s.place===k}">${n} <span class="small">(${placeRules(k).length})</span></button>`).join('')}</div>`:''}
 <label class="f" for="name">Name, Kürzel oder Gruppe (freiwillig)</label><input type="text" id="name" autocomplete="off" value="${esc(s.name)}">
 <p style="margin-top:14px"><button class="btn p" data-start ${s.mode==='ort'&&!s.place?'disabled':''}>${running?'Neue Runde starten':'Los geht’s'}</button></p>
 <details class="info"><summary>Was passiert mit Regeln, die zu keinem Wert passen?</summary><p>${TXT_KEIN_WERT}</p></details>
 <details class="info"><summary>Was passiert mit den Ergebnissen?</summary><p>${TXT_ERGEBNISSE}</p></details>
 <p class="mute small" style="margin-top:8px">Die Handyregelung wird separat behandelt und kommt hier nicht vor. Alles bleibt auf deinem Gerät, bis du die PDF selbst verschickst.</p></section>`;
}
function choiceBtn(k,a){
 const sm=VAL[k].m?`<small><b>${VAL[k].m}</b> ${VAL[k].s}</small>`:`<small>${VAL[k].s}</small>`;
 return `<button class="ch c${k} ${a&&a.p===k?'pick':''}" data-pick="${k}" ${a?'disabled':''}>${VAL[k].n}${sm}</button>`;
}
function vPlay(){
 if(s.pos>=s.order.length){s.screen='check';save();return render()}
 const r=BY[s.order[s.pos]],a=s.ans[r.id],st=stats();
 let h=`<div class="hud"><span>Regel ${s.pos+1} von ${s.order.length}</span><span>${st.pts} Punkte${st.streak>1?` · Serie ${st.streak}`:''}</span></div>
 <div class="bar"><i style="width:${(s.pos+(a?1:0))/s.order.length*100}%"></i></div>
 <section class="panel">${r.p.map(p=>`<span class="tag">${PLACES[p]}</span>`).join('')}<p class="rule">${esc(r.t)}</p>
 <div class="choices">${['L','G','V','O'].map(k=>choiceBtn(k,a)).join('')}</div>`;
 if(a){
  const j=judge(r,a.p);
  const head={r:'Gleiche Einschätzung wie das Team. (+2)',t:'Vertretbar, die Regel passt auch dorthin. (+1)',w:'Das Team hat das anders zugeordnet.'}[j];
  h+=`<div class="fb ${j}"><b>${head}</b>Vorschlag: ${VAL[r.k].n}. ${esc(r.w)}`;
  if(r.k==='O')h+=`<div class="decide"><b>Was soll mit dieser Regel passieren?</b><div class="opts">${Object.entries(DECIDE).map(([k,n])=>`<button class="chip" data-decide="${k}" aria-pressed="${a.o===k}">${n}</button>`).join('')}</div></div>`;
  h+=`</div><details class="note" ${a.d||a.n?'open':''}><summary>Das sehe ich anders oder möchte etwas anmerken</summary>
  <label class="chk"><input type="checkbox" id="diff" ${a.d?'checked':''}> Ich sehe die Zuordnung anders.</label>
  <textarea id="rn" aria-label="Anmerkung zu dieser Regel">${esc(a.n||'')}</textarea></details>
  <p class="row" style="margin-top:12px"><span></span><button class="btn p" data-next>${s.pos+1<s.order.length?'Nächste Regel':'Weiter zu den vier Fragen'}</button></p>`;
 }
 h+=`</section><p class="row"><button class="link" data-notes>Regel ergänzen oder Anmerkung schreiben</button><button class="link" data-home>Runde abbrechen</button></p>`;
 $('#main').innerHTML=h;
}
function ownForm(defPlace){
 return `<label class="f" for="ok">Art</label><select id="ok">${KINDS.map(k=>`<option>${k}</option>`).join('')}</select>
 <label class="f" for="ot">Regel oder Anmerkung</label><textarea id="ot"></textarea>
 <label class="f" for="oo">Ort (freiwillig)</label><input type="text" id="oo" autocomplete="off" placeholder="zum Beispiel Mensa" value="${esc(defPlace||'')}">
 <p style="margin-top:10px"><button class="btn" data-addown>Eintrag hinzufügen</button></p>
 ${s.own.map((o,i)=>`<div class="own"><span><b>${esc(o.k)}:</b> ${esc(o.t)}${o.o?` (${esc(o.o)})`:''}</span><button class="link" data-delown="${i}">Löschen</button></div>`).join('')}`;
}
function vNotes(){
 $('#main').innerHTML=`<section class="panel"><h2>Was fehlt dir, was ist unklar?</h2>${ownForm(s.mode==='ort'?PLACES[s.place]:'')}
 <p class="row" style="margin-top:12px"><span></span><button class="btn p" data-return>Zurück zum Spiel</button></p></section>`;
}
function vCheck(){
 $('#main').innerHTML=`<section class="panel"><h2>Tragen die Werte?</h2><p class="mute">Vier kurze Fragen. Sie sind uns wichtiger als die Punkte.</p>
 ${CHECK.map((q,i)=>`<div class="likert"><p>${q}</p><div class="scale">${SCALE.map((l,j)=>`<button data-lk="${i}" data-v="${j}" aria-pressed="${s.lk[i]===j}">${l}</button>`).join('')}</div></div>`).join('')}
 <label class="f" for="vn">Fehlt dir ein Wert, oder würdest du einen anders formulieren? (freiwillig)</label><textarea id="vn">${esc(s.vn)}</textarea>
 <p class="row" style="margin-top:12px"><span class="mute small">${Object.keys(s.lk).length} von 4 beantwortet</span><button class="btn p" data-toend>Zum Ergebnis</button></p></section>`;
}
function posterFor(place){
 const ids=s.order.filter(id=>s.ans[id]);
 const grp=k=>ids.filter(id=>s.ans[id].p===k).map(id=>BY[id]);
 const pg=k=>{const g=grp(k);return g.length?`<div class="pg c${k}"><h3>${k==='O'?'Ohne Wert (nicht auf dem Plakat)':VAL[k].n}</h3><ul>${g.map(r=>`<li>${esc(r.t)}</li>`).join('')}</ul></div>`:''};
 return `<section class="panel"><h2>So sähe dein Plakat für „${esc(PLACES[place])}“ aus</h2><p class="mute small">Sortiert nach deiner Zuordnung.</p><div class="poster">${['L','G','V','O'].map(pg).join('')}</div></section>`;
}
function vEnd(){
 const c=stats(),pct=c.max?c.pts/c.max:0,title=pct>=.8?'Werte-Profi':pct>=.5?'Auf gutem Kurs':'Viel Gesprächsstoff';
 const missed=s.order.filter(id=>s.ans[id]&&judge(BY[id],s.ans[id].p)==='w').length;
 $('#main').innerHTML=`<section class="panel center"><img class="logo" src="${LOGO}" alt="" style="width:84px;height:84px"><h1>${title}</h1><div class="score">${c.pts} von ${c.max}</div>
 <div class="stats"><div class="stat r"><b>${c.r}</b>gleich</div><div class="stat t"><b>${c.t}</b>vertretbar</div><div class="stat w"><b>${c.w}</b>anders</div></div>
 <p class="mute">${modeLabel()}. Beste Serie: ${c.best}. ${missed?`Bei ${missed} Regeln hast du anders entschieden als das Team. Genau darüber sollten wir reden.`:'Du liegst überall nah am Vorschlag des Teams.'}</p></section>
 ${s.mode==='ort'?posterFor(s.place):''}
 <section class="panel"><h2>Was fehlt dir, was ist unklar?</h2>${ownForm(s.mode==='ort'?PLACES[s.place]:'')}
 <label class="f" for="misc">Sonstige Anmerkungen zur neuen Schulordnung</label><textarea id="misc">${esc(s.misc)}</textarea></section>
 <section class="panel"><h2>PDF ans Team schicken</h2><p>Erzeuge die PDF und schicke sie in Teams an Felix, Anna-Lena oder Vanessa.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn p" data-pdf>PDF erstellen</button>${canShare()?'<button class="btn" data-share>PDF teilen</button>':''}<button class="btn" data-again>Noch eine Runde</button></div></section>`;
}
function canShare(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Uint8Array(1)],'a.pdf',{type:'application/pdf'})]}))}catch(e){return false}}
function pdfName(){const n=(s.name||'').replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g,'_').replace(/^_+|_+$/g,'');return 'Regelspiel'+(n?'_'+n:'')+'_'+(s.mode==='ort'?s.place:s.mode)+'.pdf'}
function buildDoc(){
 const c=stats(),B=[];
 B.push({h:'Tragen die Werte?'});
 CHECK.forEach((q,i)=>B.push({p:q,b:true,gap:0},{p:'Antwort: '+(s.lk[i]===undefined?'keine Angabe':SCALE[s.lk[i]]),gap:6}));
 B.push({p:'Fehlender oder anders formulierter Wert: '+(s.vn.trim()||'keine Angabe')});
 const dec=s.order.filter(id=>s.ans[id]&&s.ans[id].o);
 if(dec.length){B.push({h:'Regeln ohne Wert: Was soll passieren?'});dec.forEach(id=>B.push({p:`${BY[id].t} → ${DECIDE[s.ans[id].o]}`}))}
 B.push({h:'Zuordnungen'});
 s.order.filter(id=>s.ans[id]).forEach((id,i)=>{const r=BY[id],a=s.ans[id];
  B.push({row:{t:`${i+1}. ${r.t}`,line:`${placeLabel(r)}. Zugeordnet: ${VAL[a.p].n}. Vorschlag: ${VAL[r.k].n}. `,res:judge(r,a.p),extra:[a.d?'Sieht die Zuordnung anders.':'',a.n?'Anmerkung: '+a.n:''].filter(Boolean)}})});
 B.push({h:'Eigene Einträge'});
 if(s.own.length)s.own.forEach(o=>B.push({p:`${o.k}: ${o.t}${o.o?' ('+o.o+')':''}`}));else B.push({p:'Keine.'});
 B.push({h:'Sonstige Anmerkungen'},{p:s.misc.trim()||'Keine.'});
 return{meta:['Name, Kürzel oder Gruppe: '+(s.name||'nicht angegeben'),'Datum: '+new Date().toLocaleDateString('de-DE'),'Modus: '+modeLabel(),`Bearbeitet: ${c.done} von ${s.order.length} Regeln`],stats:c,blocks:B};
}
function pdfBlob(){const str=makePDF(buildDoc(),LOGO.split(',')[1]);return new Blob([Uint8Array.from(str,x=>x.charCodeAt(0))],{type:'application/pdf'})}
/*PDF-START*/
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN={'€':128,'‚':130,'„':132,'…':133,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'→':0};
function winByte(ch){const u=ch.charCodeAt(0);if(ch in WIN)return WIN[ch]||45;if(u<128||(u>=160&&u<256))return u;return 63}
function chW(ch,b){if(ch==='→')ch='-';const base=ch==='ß'?'':ch.normalize('NFD')[0];const c=base?base.charCodeAt(0):0;const w=ch==='ß'?611:(c>=32&&c<127?HW[c-32]:556);return b?w*1.07:w}
function strW(t,size,b){let w=0;for(const ch of t)w+=chW(ch,b);return w*size/1000}
function pdfStr(t){let o='(';for(const ch of t){const c=winByte(ch);if(c===40||c===41||c===92)o+='\\'+String.fromCharCode(c);else if(c<32||c>126)o+='\\'+c.toString(8).padStart(3,'0');else o+=String.fromCharCode(c)}return o+')'}
function wrap(t,size,b,w){const out=[];String(t).split(/\r?\n/).forEach(par=>{let l='';par.split(/\s+/).filter(Boolean).forEach(word=>{const n=l?l+' '+word:word;if(strW(n,size,b)<=w)l=n;else{if(l)out.push(l);l=word;while(strW(l,size,b)>w){let i=l.length-1;while(i>1&&strW(l.slice(0,i),size,b)>w)i--;out.push(l.slice(0,i));l=l.slice(i)}}});out.push(l)});return out}
function makePDF(d,logo){
 const W=595,H=842,M=48,CW=W-2*M,pages=[];let c='',y=H-M;
 const newPage=()=>{if(c)pages.push(c);c='';y=H-M};
 const need=h=>{if(y-h<M+16)newPage()};
 const color=a=>a.map(x=>x.toFixed(3)).join(' ');
 const INK=[.14,.15,.17],GREY=[.36,.38,.42];
 const text=(t,x,yy,size,b,col)=>{c+=`BT /F${b?2:1} ${size} Tf ${color(col||INK)} rg ${x} ${yy.toFixed(1)} Td ${pdfStr(t)} Tj ET\n`};
 const para=(t,size,b,col,gap=3)=>{const lh=size*1.3;wrap(t,size,b,CW).forEach(l=>{need(lh);y-=lh;text(l,M,y,size,b,col)});y-=gap};
 const RES={r:[.18,.54,.24],t:[.54,.39,0],w:[.70,.22,.16]},RL={r:'gleich',t:'vertretbar',w:'anders'};
 if(logo)c+=`q 64 0 0 64 ${W-M-64} ${H-M-64} cm /Im1 Do Q\n`;
 text('KDS-Regelspiel: Auswertung',M,y-22,19,true);y-=34;
 d.meta.forEach(m=>para(m,11,false,INK,2));
 y=Math.min(y,H-M-80);
 const S=d.stats,bw=(CW-20)/3,top=y-46;
 [['gleich',S.r,'r'],['vertretbar',S.t,'t'],['anders',S.w,'w']].forEach(([n,v,k],i)=>{const x=M+i*(bw+10);
  c+=`${color(RES[k])} rg ${x} ${top} ${bw} 44 re f\n`;text(String(v),x+10,top+15,20,true,[1,1,1]);text(n,x+46,top+17,12,false,[1,1,1])});
 y=top-8;
 para(`Punkte: ${S.pts} von ${S.max}. „Gleich“: wie der Arbeitsvorschlag des Teams. „Vertretbar“: die Regel passt laut Vorschlag auch zu diesem Wert.`,9,false,GREY);
 d.blocks.forEach(b=>{
  if(b.h){need(44);y-=12;para(b.h,13,true)}
  else if(b.p!==undefined)para(b.p,b.size||10.5,!!b.b,INK,b.gap===undefined?3:b.gap);
  else if(b.row){const r=b.row,lines=wrap(r.t,10.5,true,CW);need(lines.length*14+18);
   lines.forEach(l=>{y-=14;text(l,M,y,10.5,true)});
   const ll=wrap(r.line+RL[r.res],9.5,false,CW);
   ll.forEach((l,i)=>{y-=12.5;if(i===ll.length-1&&l.endsWith(RL[r.res])){const pre=l.slice(0,l.length-RL[r.res].length);text(pre,M,y,9.5,false,GREY);text(RL[r.res],M+strW(pre,9.5,false),y,9.5,true,RES[r.res])}else text(l,M,y,9.5,false,GREY)});
   y-=2;r.extra.forEach(e=>para(e,9.5,false,INK,0));y-=6}
 });
 newPage();
 const n=pages.length,objs=[],first=logo?6:5,kids=[];
 for(let i=0;i<n;i++)kids.push(`${first+i*2} 0 R`);
 objs[1]='<</Type/Catalog/Pages 2 0 R>>';
 objs[2]=`<</Type/Pages/Count ${n}/Kids[${kids.join(' ')}]>>`;
 objs[3]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
 objs[4]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
 if(logo){const bin=atob(logo),sz=jpegSize(bin);objs[5]=`<</Type/XObject/Subtype/Image/Width ${sz[0]}/Height ${sz[1]}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${bin.length}>>\nstream\n${bin}\nendstream`}
 pages.forEach((p,i)=>{
  const body=p+`BT /F1 8 Tf .45 .45 .45 rg ${W-M-40} 26 Td ${pdfStr('Seite '+(i+1)+' von '+n)} Tj ET\n`,pn=first+i*2;
  objs[pn]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>${logo?'/XObject<</Im1 5 0 R>>':''}>>/Contents ${pn+1} 0 R>>`;
  objs[pn+1]=`<</Length ${body.length}>>\nstream\n${body}endstream`;
 });
 let out='%PDF-1.4\n';const off=[];
 for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const xr=out.length;
 out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 return out+`trailer\n<</Size ${objs.length}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
}
function jpegSize(b){let i=2;while(i<b.length){const m=b.charCodeAt(i+1),l=b.charCodeAt(i+2)*256+b.charCodeAt(i+3);if(m>=192&&m<=194)return[b.charCodeAt(i+7)*256+b.charCodeAt(i+8),b.charCodeAt(i+5)*256+b.charCodeAt(i+6)];i+=2+l}return[100,100]}
/*PDF-END*/
function flush(){const m=$('#misc');if(m)s.misc=m.value;const v=$('#vn');if(v)s.vn=v.value;save()}
function pendingOwn(){const ot=$('#ot');if(ot&&ot.value.trim()){toast('Bitte erst „Eintrag hinzufügen“ antippen.');ot.focus();return true}return false}
function pick(k){const id=s.order[s.pos];if(s.ans[id])return;s.ans[id]={p:k,d:false,n:'',o:''};save();render();const fb=$('.fb');if(fb&&fb.getBoundingClientRect().bottom>innerHeight)fb.scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
 if(d.mode){s.mode=d.mode;save();render()}
 else if(d.place){s.place=d.place;save();render()}
 else if('resume' in d){s.screen='play';save();render()}
 else if('start' in d){const n=$('#name').value.trim(),m=s.mode,p=s.place;s=fresh(n);s.mode=m;s.place=p;s.order=draw(m,p);s.screen='play';save();render()}
 else if(d.pick)pick(d.pick);
 else if(d.decide){const a=s.ans[s.order[s.pos]];a.o=a.o===d.decide?'':d.decide;save();render()}
 else if('next' in d){s.pos++;save();render()}
 else if('notes' in d){s.screen='notes';save();render()}
 else if('return' in d){s.screen='play';save();render()}
 else if('home' in d){s.screen='start';save();render()}
 else if(d.lk!==undefined){s.lk[d.lk]=+d.v;flush();vCheck()}
 else if('toend' in d){flush();s.screen='end';save();render()}
 else if('addown' in d){const tx=$('#ot').value.trim();if(!tx){toast('Bitte zuerst etwas eintragen.');return}
  flush();s.own.push({k:$('#ok').value,t:tx,o:$('#oo').value.trim()});save();render();toast('Eintrag hinzugefügt')}
 else if(d.delown){flush();s.own.splice(+d.delown,1);save();render()}
 else if('pdf' in d){if(pendingOwn())return;flush();const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob());a.download=pdfName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PDF erstellt. Schicke sie jetzt in Teams ans Team.')}
 else if('share' in d){if(pendingOwn())return;flush();navigator.share({files:[new File([pdfBlob()],pdfName(),{type:'application/pdf'})],title:'KDS-Regelspiel'}).catch(()=>{})}
 else if('again' in d){if(confirm('Eine neue Runde löscht dieses Ergebnis. Hast du die PDF schon verschickt?')){s=fresh(s.name);save();render()}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='rn'){s.ans[s.order[s.pos]].n=t.value;save()}
 else if(t.id==='misc'){s.misc=t.value;save()}
 else if(t.id==='vn'){s.vn=t.value;save()}
 else if(t.id==='name'){s.name=t.value.trim();save()}
});
document.addEventListener('change',e=>{if(e.target.id==='diff'){s.ans[s.order[s.pos]].d=e.target.checked;save()}});
document.addEventListener('keydown',e=>{
 if(s.screen!=='play'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 const k={1:'L',2:'G',3:'V',4:'O'}[e.key];
 if(k)pick(k);
 else if(e.key==='Enter'&&s.ans[s.order[s.pos]]){e.preventDefault();s.pos++;save();render()}
});
render();
</script>
</body>
</html>
