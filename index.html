<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDS-Regelkompass</title>
<style>
:root{color-scheme:light;--bg:#f6f6f2;--card:#fff;--ink:#23262b;--mute:#5d6269;--line:#dcdcd5;
--L:#0a5fae;--Ll:#e6f0f9;--G:#d81b7f;--Gl:#fce8f3;--V:#2f8a3e;--Vl:#e7f4e9;--O:#7a5a00;--Ol:#fff6d6;--A:#5a5f68;--Al:#ecedef;--S:#6b4fa0;--Sl:#efebf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top img{width:52px;height:52px}
.top h1{font-size:1.25rem;margin:0}
.top p{margin:0;color:var(--mute);font-size:.88rem}
.progress{margin-left:auto;min-width:170px;font-size:.85rem;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--V)}
nav{max-width:1100px;margin:auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 13px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--mute)}
nav button[aria-current=page]{border-color:var(--ink);color:var(--ink);font-weight:600}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h2{font-size:1.15rem;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.value{border:2px solid var(--c);background:var(--card);border-radius:12px;padding:14px;text-align:left;width:100%}
.value b{display:block;color:var(--c);font-size:1.3rem}
.value .n{font-weight:600}
.value em{display:block;font-style:normal;font-weight:600;margin:5px 0 3px}
.value small{color:var(--mute);display:block}
.value[aria-pressed=true]{background:var(--cl);box-shadow:0 0 0 2px var(--c)}
.bins{margin-top:12px}
.bin{border-width:1px;padding:10px 14px}
.bin b{font-size:1.02rem}
.cL{--c:var(--L);--cl:var(--Ll)}.cG{--c:var(--G);--cl:var(--Gl)}.cV{--c:var(--V);--cl:var(--Vl)}
.cO{--c:var(--O);--cl:var(--Ol)}.cA{--c:var(--A);--cl:var(--Al)}.cS{--c:var(--S);--cl:var(--Sl)}
#detail{margin-top:20px;scroll-margin-top:125px}
.explain{background:var(--Ol);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.rule{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:11px 13px;margin-bottom:9px}
.rule p.t{margin:0 0 7px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font-size:.77rem;background:var(--Al);border-radius:10px;padding:1px 8px}
.tag.warn{background:var(--Ol);color:#6d4f00}
.tag.flag{background:#ffe3df;color:#8b2316}
.tag.dec{background:var(--ink);color:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.88rem}
select,input[type=search],input[type=text],textarea{border:1px solid #aaa;border-radius:6px;background:#fff;padding:6px 8px;max-width:100%}
.also label{margin-right:7px;white-space:nowrap}
.decide{margin-top:8px;font-size:.88rem}
details{margin-top:7px;font-size:.88rem}
summary{cursor:pointer;color:var(--mute)}
details p{margin:5px 0}
.hint{background:var(--Ol);border-radius:6px;padding:5px 8px}
textarea{width:100%;min-height:58px;margin-top:4px}
.btn{border:1px solid #999;background:#fff;border-radius:7px;padding:7px 12px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px}
.bar-row input[type=search]{flex:1 1 210px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #aaa;background:#fff;border-radius:16px;padding:4px 11px;font-size:.88rem}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sort{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:720px;margin:auto}
.sort .big{font-size:1.35rem;font-weight:600;margin:9px 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{border:2px solid var(--c);background:var(--cl);border-radius:9px;padding:11px;font-weight:600;color:var(--ink)}
.choice kbd{font:inherit;font-size:.78rem;color:var(--mute);font-weight:400;margin-left:4px}
.choice.on{background:var(--c);color:#fff}
.choice.on kbd{color:#fff}
.reveal{margin-top:14px;padding:11px;border-radius:8px;background:var(--bg)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
#poster{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;max-width:760px;margin:auto}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.phead img{width:82px;height:82px}
.phead h3{margin:0;font-size:1.65rem}
.pgroup{border-left:6px solid var(--c);padding:2px 0 2px 12px;margin:14px 0}
.pgroup h4{margin:0;color:var(--c);font-size:1.1rem}
.pgroup small{color:var(--mute)}
.pgroup ul{margin:6px 0 0;padding-left:20px}
.pgroup li{margin:3px 0}
.porg{border-top:1px dashed #aaa;margin-top:18px;padding-top:10px;font-size:.92rem}
.porg h4{margin:0;font-size:1rem}
.porg ul{margin:6px 0 0;padding-left:20px}
.empty{color:var(--mute);padding:14px;background:var(--card);border:1px dashed #aaa;border-radius:8px}
.addform{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.addform .ctl input[type=text]{flex:1 1 260px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.src li{margin:3px 0}
@media (max-width:700px){header{position:static}.top img{width:40px;height:40px}.progress{margin-left:0;width:100%}#detail{scroll-margin-top:8px}}
@media print{
 @page{size:A4 portrait;margin:14mm}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,#toast,.noprint{display:none!important}
 main{padding:0;max-width:none}
 #poster{border:0;max-width:none;padding:0;font-size:1.1rem}
 .pgroup{break-inside:avoid}
}
</style>
</head>

const TABS=[['werte','Werte'],['sort','Sortieren'],['alle','Alle Regeln'],['orte','Orte und Plakate'],['stand','Stand und Quellen']];
function render(){
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" ${ui.view===k?'aria-current="page"':''}>${n}</button>`).join('');
 const rs=rules(),done=rs.filter(r=>st.rv[r.id]).length;
 $('#prog').textContent=`${done} von ${rs.length} Regeln geprüft`;
 $('#progbar').style.width=(rs.length?done/rs.length*100:0)+'%';
 ({werte:vWerte,sort:vSort,alle:vAlle,orte:vOrte,stand:vStand})[ui.view]();
}
function decideCtl(r){
 if(val(r)!=='O')return '';
 return `<div class="decide"><label>Was passiert mit der Regel? <select data-dc="${r.id}"><option value="">noch offen</option>${Object.entries(DECIDE).map(([k,n])=>`<option value="${k}" ${st.dc[r.id]===k?'selected':''}>${n}</option>`).join('')}</select></label></div>`;
}
function ruleCard(r){
 const v=val(r),changed=st.as[r.id]&&st.as[r.id]!==r.v;
 return `<article class="rule c${v}">
 <p class="t">${esc(r.t)}</p>
 <div class="meta">${r.o.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}<span class="tag">${TYP[r.y]}</span>
 ${r.h?'<span class="tag warn">Hinweis</span>':''}${st.fl[r.id]?'<span class="tag flag">Überflüssig?</span>':''}${st.no[r.id]?'<span class="tag">Notiz</span>':''}${changed?'<span class="tag">Zuordnung geändert</span>':''}${v==='O'&&st.dc[r.id]?`<span class="tag dec">${DECIDE[st.dc[r.id]]}</span>`:''}</div>
 <div class="ctl"><label>Zuordnung <select data-assign="${r.id}">${KEYS.map(k=>`<option value="${k}" ${k===v?'selected':''}>${VAL[k].name}</option>`).join('')}</select></label>
 <span class="also">passt auch zu: ${['L','G','V'].filter(k=>k!==v).map(k=>`<label><input type="checkbox" data-also="${r.id}" value="${k}" ${als(r).includes(k)?'checked':''}> ${VAL[k].name}</label>`).join('')}</span></div>
 ${decideCtl(r)}
 <details><summary>Begründung, Quelle und Notiz</summary>
 <p><b>Warum dieser Vorschlag:</b> ${esc(r.w||'Selbst ergänzt.')} (Vorschlag: ${VAL[r.v].name})</p>
 <p><b>Quelle:</b> ${esc(r.s)}</p>

 <label style="display:block;margin-top:6px">Notiz für die Überarbeitung<textarea data-note="${r.id}">${esc(st.no[r.id]||'')}</textarea></label>
 ${r.c?`<button class="btn" data-del="${r.id}">Regel löschen</button>`:''}
 </details></article>`;
}

  return `<button class="value ${main?'':'bin'} c${k}" data-val="${k}" aria-pressed="${ui.sel===k}"><b>${x.name}</b><span class="n">${cnt(k)} Regeln</span>${x.norm?`<em>${x.norm}</em>`:''}<small>${x.text}</small></button>`};
 $('#main').innerHTML=`<h2>Regeln nach Werten</h2><p class="lead">Ein Klick auf einen Wert zeigt alle Regeln, die darunter fallen. Die Zuordnungen sind Vorschläge und lassen sich an jeder Regel ändern.</p>
 <div class="grid3">${['L','G','V'].map(card).join('')}</div><div class="grid3 bins">${['O','A','S'].map(card).join('')}</div><div id="detail"></div>`;
 if(ui.sel)renderDetail();
}
function renderDetail(){
 const k=ui.sel,rs=rules();
 let list=rs.filter(r=>val(r)===k);
 const ol=[...new Set(list.flatMap(r=>r.o))].sort((a,b)=>a.localeCompare(b,'de'));
 if(ui.ort&&!ol.includes(ui.ort))ui.ort=null;
 if(ui.ort)list=list.filter(r=>at(r,ui.ort));
 const also=['L','G','V'].includes(k)?rs.filter(r=>val(r)!==k&&als(r).includes(k)&&(!ui.ort||at(r,ui.ort))):[];
 let extra='';
 if(k==='O'){const all=rs.filter(r=>val(r)==='O'),c=x=>all.filter(r=>(st.dc[r.id]||'')===x).length;
  extra=`<p class="explain">${TXT_KEIN_WERT}<br><b>Stand:</b> ${c('k')} bleiben als Hinweis, ${c('u')} werden umformuliert, ${c('w')} können weg, ${c('')} sind noch offen.</p>`}
 $('#detail').innerHTML=`<h2>${VAL[k].name}: ${list.length} Regeln</h2>${extra}
 <div class="chips"><button class="chip" data-ort="" aria-pressed="${!ui.ort}">Alle Orte</button>${ol.map(o=>`<button class="chip" data-ort="${esc(o)}" aria-pressed="${ui.ort===o}">${esc(o)}</button>`).join('')}</div>
 ${list.map(ruleCard).join('')||'<p class="empty">Hier liegt gerade keine Regel.</p>'}
 ${also.length?`<details><summary>Dazu ${also.length} Regeln, die hauptsächlich woanders stehen, aber auch hierzu passen</summary><div style="margin-top:8px">${also.map(ruleCard).join('')}</div></details>`:''}`;
}
function sortPool(){
 const rs=rules();
 return ui.sMode==='neu'?rs.filter(r=>!st.rv[r.id]):ui.sMode==='offen'?rs.filter(r=>val(r)==='O'&&!st.dc[r.id]):rs.filter(r=>r.y==='W'&&!st.rv[r.id]);
}
function vSort(){
 let r=ui.sId&&byId(ui.sId);
 if(!r&&!ui.sEnd){const p=sortPool();r=p[0];ui.sId=r?r.id:null;ui.sDone=false}
 const modes=[['neu','Alle ungeprüften'],['wort','Nur mit Wortlaut'],['offen','Ohne Wert, noch nicht entschieden']];
 let h=`<div class="chips" style="justify-content:center">${modes.map(([k,n])=>`<button class="chip" data-smode="${k}" aria-pressed="${ui.sMode===k}">${n}</button>`).join('')}</div>`;
 if(!r){h+=`<p class="empty" style="text-align:center">In diesem Stapel ist nichts mehr zu sortieren.</p>`+(ui.hist.length?`<div class="foot"><button class="btn" data-sback>Zurück</button></div>`:'');$('#main').innerHTML=h;return}
 const sel=ui.sDone?val(r):null;
 h+=`<section class="sort"><div class="meta">${r.o.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}<span class="tag">${TYP[r.y]}</span><span class="tag">noch ${sortPool().length} im Stapel</span></div>
 <p class="big">${esc(r.t)}</p><p class="lead">Zu welchem Wert gehört diese Regel? Entscheidet zuerst selbst, danach erscheint der Vorschlag.</p>
 <div class="choices">${KEYS.map((k,i)=>`<button class="choice c${k} ${sel===k?'on':''}" data-pick="${k}">${VAL[k].name}<kbd>${i+1}</kbd></button>`).join('')}</div>`;
 if(ui.sDone){
  h+=`<div class="reveal"><b>${sel===r.v?'Gleiche Einschätzung wie der Vorschlag.':`Der Vorschlag war ${VAL[r.v].name}.`}</b> ${esc(r.w||'')}${r.h?`<p class="hint">${esc(r.h)}</p>`:''}
  ${decideCtl(r)}
  <label style="display:block;margin-top:7px">Notiz<textarea data-note="${r.id}">${esc(st.no[r.id]||'')}</textarea></label></div>`;
 }
 h+=`<div class="foot"><button class="btn" data-sback ${ui.hist.length?'':'disabled'}>Zurück</button>
 ${ui.sDone?'<button class="btn primary" data-snext>Nächste Regel</button>':'<button class="btn" data-sskip>Überspringen</button>'}</div></section>`;
 $('#main').innerHTML=h;
}
function nextSort(){
 const p=sortPool(),i=p.findIndex(r=>r.id===ui.sId);
 const n=i>=0?p[i+1]:p[0];
 if(ui.sId)ui.hist.push(ui.sId);
 ui.sId=n?n.id:null;ui.sDone=false;ui.sEnd=!n;
 render();
}
function filtered(){
 const q=ui.q.trim().toLowerCase();
 return rules().filter(r=>(!q||(r.t+' '+r.o.join(' ')+' '+r.s+' '+(st.no[r.id]||'')).toLowerCase().includes(q))&&(!ui.fv||val(r)===ui.fv)&&(!ui.fo||at(r,ui.fo))&&(!ui.fy||r.y===ui.fy)&&(!ui.fh||r.h||st.fl[r.id]||st.no[r.id]));
}

 $('#main').innerHTML=`<h2>Stand sichern und weitergeben</h2><p class="lead">Der Stand bleibt in diesem Browser gespeichert. Für Anna-Lena und Vanessa speicherst du ihn als Datei, sie laden ihn in ihre Kopie. Dabei ersetzt die geladene Datei den dortigen Stand.</p>
 <div class="tools"><button class="btn primary" data-export>Stand als Datei speichern</button><button class="btn" data-import>Stand laden</button><button class="btn" data-csv>Regelliste als CSV</button><button class="btn" data-reset>Alles zurücksetzen</button></div>
 <h2 style="margin-top:22px">Zahlen</h2><p>${rs.length} Einträge, davon ${rs.filter(r=>r.y==='W').length} mit Wortlaut, ${rs.filter(r=>r.y==='T').length} nur als Stichwort und ${rs.filter(r=>r.y==='P').length} GLK-Vorschläge. ${diff} Zuordnungen weichen vom ersten Vorschlag ab, ${Object.keys(st.fl).filter(k=>st.fl[k]).length} Regeln sind als „überflüssig?“ markiert. Bei ${os.filter(r=>st.dc[r.id]).length} von ${os.length} Regeln ohne Wert ist entschieden, was mit ihnen passiert.</p>
 <h2 style="margin-top:22px">Quellen</h2><ul class="src">${src.map(s=>`<li>${esc(s)}: ${rs.filter(r=>r.s===s).length}</li>`).join('')}</ul>
 <p class="lead">Die Regeln mit Wortlaut haben dieselben Kennungen wie im Regelspiel v2.0. Die Plakattexte für Ruhe-, Medien- und Ganztagesraum sowie die Aktive Pause sind weitgehend gleich und stehen deshalb nur einmal drin, mit allen Orten. Nicht aufgenommen sind die Ottheinrich-Vorlage (außer dem KDS-Abschnitt zu den Pausen), andere Schulordnungen und die Bastelzeiten außer der Regel zum Einstieg.</p>`;
}
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function assign(id,k){const r=byId(id);st.as[id]=k;st.rv[id]=1;if(st.al[id]||r.a.includes(k))st.al[id]=als(r).filter(x=>x!==k);save()}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 const d=t.dataset;
 if(d.tab){ui.view=d.tab;render();window.scrollTo(0,0)}
 else if(d.val){ui.sel=ui.sel===d.val?null:d.val;ui.ort=null;render();if(ui.sel)$('#detail').scrollIntoView({behavior:'smooth'})}
 else if('ort' in d){ui.ort=d.ort||null;renderDetail()}
 else if(d.smode){ui.sMode=d.smode;ui.sId=null;ui.sDone=false;ui.sEnd=false;ui.hist=[];render()}
 else if(d.pick){assign(ui.sId,d.pick);ui.sDone=true;render()}
 else if('snext' in d||'sskip' in d)nextSort();
 else if('sback' in d){ui.sId=ui.hist.pop();ui.sDone=!!st.rv[ui.sId];ui.sEnd=false;render()}
 else if(d.port){ui.pOrt=d.port;render()}
 else if('print' in d)window.print();
 else if('export' in d){download('Regelkompass_Stand.json','application/json',JSON.stringify(st,null,1));toast('Stand gespeichert')}
 else if('import' in d)$('#file').click();
 else if('csv' in d){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';download('Regelkompass_Liste.csv','text/csv;charset=utf-8','﻿'+[['Kennung','Regel','Orte','Zuordnung','Passt auch zu','Was passiert (ohne Wert)','Art','Quelle','Überflüssig?','Notiz'].map(q).join(';')].concat(rules().map(r=>[r.id,r.t,r.o.join(', '),VAL[val(r)].name,als(r).map(k=>VAL[k].name).join(', '),val(r)==='O'?(DECIDE[st.dc[r.id]]||'noch offen'):'',TYP[r.y],r.s,st.fl[r.id]?'ja':'',st.no[r.id]||''].map(q).join(';'))).join('\r\n'))}
 else if('reset' in d){if(confirm('Alle Zuordnungen, Entscheidungen, Notizen und eigenen Regeln zurücksetzen?')){st=blank();save();ui.sId=null;ui.hist=[];render();toast('Zurückgesetzt')}}
 else if(d.del){if(confirm('Diese Regel löschen?')){st.cu=st.cu.filter(r=>r.id!==d.del);save();render()}}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(d.assign){assign(d.assign,t.value);render();toast('Zugeordnet: '+VAL[t.value].name)}
 else if(d.dc){if(t.value)st.dc[d.dc]=t.value;else delete st.dc[d.dc];st.rv[d.dc]=1;save();if(ui.view!=='sort')render();toast(t.value?DECIDE[t.value]:'Wieder offen')}
 else if(d.also){const r=byId(d.also),s=new Set(als(r));t.checked?s.add(t.value):s.delete(t.value);st.al[d.also]=[...s];st.rv[d.also]=1;save()}
 else if(d.flag){st.fl[d.flag]=t.checked;save();render()}
 else if(t.id==='fv'||t.id==='fo'||t.id==='fy'){ui[t.id]=t.value;renderList()}
 else if(t.id==='fh'){ui.fh=t.checked;renderList()}
 else if(t.id==='pall'){ui.pAll=t.checked;render()}
 else if(t.id==='file'&&t.files[0]){t.files[0].text().then(x=>{const j=JSON.parse(x);if(!j||typeof j.as!=='object')throw 0;st=Object.assign(blank(),j);save();ui.sId=null;ui.hist=[];render();toast('Stand geladen')}).catch(()=>toast('Diese Datei passt nicht.'));t.value=''}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.note){st.no[t.dataset.note]=t.value;save()}
 else if(t.id==='q'){ui.q=t.value;renderList()}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='add')return;e.preventDefault();
 const tx=$('#at').value.trim(),o=$('#ao').value.trim(),v=$('#av').value;if(!tx||!o)return;
 const id='c'+Date.now();st.cu.push({id,t:tx,o:[o],y:'W',s:'Selbst ergänzt',v,a:[],w:'',h:'',c:1});st.rv[id]=1;save();render();toast('Regel ergänzt');
});
document.addEventListener('keydown',e=>{
 if(ui.view!=='sort'||!ui.sId||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 const i=+e.key-1;
 if(i>=0&&i<6){assign(ui.sId,KEYS[i]);ui.sDone=true;render()}
 else if(e.key==='Enter'&&ui.sDone){e.preventDefault();nextSort()}
});
render();
</script>
</body>
</html>
